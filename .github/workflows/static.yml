# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage static site (exclude backend)
        # src/ 里现在含有后端目录（src/server 与 <mod>/server，内含数据库配置），
        # 不能随静态站点发布到 GitHub Pages：这里先剔除后端与证书，再上传纯静态站点。
        run: |
          mkdir -p _site
          rsync -a --exclude 'server' --exclude 'node_modules' --exclude '/key' --exclude '*.key' --exclude '*.pem' ./src/ ./_site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload static site only (backend excluded)
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
