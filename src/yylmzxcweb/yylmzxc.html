<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YYLMZXC</title>
  <meta name="description" content="A startpage with online resources about YYLMZXC, created by 鸿蒙幻星辰.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='78' font-size='80'>%F0%9F%A7%AD</text></svg>">
  <link rel="stylesheet" href="res/styles.css">
</head>
<body>
  <div class="bg no-image" id="bg"></div>

  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer">
        <div class="brand-text">
          <h1 id="page-title">导航</h1>
          <p id="page-desc"></p>
        </div>
      </div>

      <div class="tools">
        <label class="search" title="搜索书签（按 / 聚焦）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="search" type="search" placeholder="搜索书签..." autocomplete="off" spellcheck="false">
        </label>

        <button class="btn" id="btn-theme" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path>
          </svg>
        </button>

        <button class="btn mode-btn" id="btn-mode" title="切换浏览模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="7.5" ry="3"></ellipse>
            <path d="M4.5 5v14c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V5"></path>
            <path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"></path>
          </svg>
          <span class="label">数据库</span>
        </button>

        <button class="btn primary" id="btn-edit" title="编辑模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path>
          </svg>
          <span class="label">编辑</span>
        </button>

        <button class="btn" id="btn-import" title="导入 JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M5 21h14"></path>
          </svg>
          <span class="label">导入</span>
        </button>

        <button class="btn" id="btn-export" title="导出 JSON">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21V9"></path><path d="M7 14l5-5 5 5"></path><path d="M5 3h14"></path>
          </svg>
          <span class="label">导出</span>
        </button>

        <button class="btn" id="btn-convert" title="数据转换（数据库 → 静态文件）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13l-3.5-3.5"></path><path d="M20 16H7l3.5 3.5"></path>
          </svg>
          <span class="label">转换</span>
        </button>

        <button class="btn danger" id="btn-reset" title="以静态文件为准重置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1015-6.7L21 8"></path><path d="M21 3v5h-5"></path>
          </svg>
          <span class="label">重置</span>
        </button>
      </div>
    </header>

    <div class="profile-links" id="profile-links"></div>

    <main class="groups" id="groups"></main>

    <div class="add-group">
      <button class="btn primary" id="btn-add-group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14"></path><path d="M5 12h14"></path>
        </svg>
        添加分组
      </button>
    </div>

    <div class="empty" id="empty" hidden>没有匹配的书签</div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h3 id="modal-title">编辑</h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">取消</button>
        <button class="btn primary" id="modal-ok">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="res/data/nav-default.js"></script>

  <!--
    应用脚本：按依赖方向从下往上加载，越靠下依赖越多。
      基础层：纯净无依赖（工具 / DOM 原语 / 存储 / 接口 / 静态数据来源）
      视图与数据：icon → store → render → modal → feed
      业务层：auth → actions → transfer → account → dnd
      装配层：main（唯一横向引用各模块，并注入 account / dnd 所需回调，必须最后加载）
  -->
  <script src="res/js/util.js"></script>
  <script src="res/js/dom.js"></script>
  <script src="res/js/storage.js"></script>
  <script src="res/js/api.js"></script>
  <script src="res/js/source.js"></script>
  <script src="res/js/icon.js"></script>
  <script src="res/js/store.js"></script>
  <script src="res/js/render.js"></script>
  <script src="res/js/modal.js"></script>
  <script src="res/js/feed.js"></script>
  <script src="res/js/auth.js"></script>
  <script src="res/js/actions.js"></script>
  <script src="res/js/transfer.js"></script>
  <script src="res/js/account.js"></script>
  <script src="res/js/dnd.js"></script>
  <script src="res/js/main.js"></script>
</body>
</html>
