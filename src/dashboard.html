    <nav id="top-nav-bar" class="clearfix" role="navigation">
        <div class="container">
            <div class="row align-items-center">
                <div class="site-name">
                    <h1 class="site-title">
                        <a id="logo" href="index.html" title="SurvivalCraft Web">
                            <img src="./scweb_res/sczzw.png" alt="生存战争网" class="logo-icon" loading="lazy">
                            <span class="logo-text">生存战争网</span>
                        </a>
                    </h1>
                </div>
                
                <div class="nav-menu">
                    <a href="index.html" id="homeLink" data-nav="home" title="生存战争网_SC中文社区">首页</a>
                    <a href="online_server.html" id="serverListLink" data-nav="serverList" title="生存战争联机服务器地址列表">联机服务器列表</a>
                </div>
                
                <div class="dropdown-section">
                    <div class="dropdown" id="themeDropdown">
                        <button class="dropdown-toggle" id="themeToggle">☀️ <span class="arrow">▼</span></button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" data-theme="light">☀️ 白天模式</button>
                            <button class="dropdown-item" data-theme="dark">🌙 黑夜模式</button>
                            <button class="dropdown-item" data-theme="wk-light">🌿 工坊亮色</button>
                            <button class="dropdown-item" data-theme="wk-dark">🪵 工坊暗色</button>
                        </div>
                    </div>
                </div>
                
                <div class="dropdown-section">
                    <div class="dropdown" id="langDropdown">
                        <button class="dropdown-toggle" id="langToggle">🇨🇳 <span class="arrow">▼</span></button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" data-lang="zh">🇨🇳 中文</button>
                            <button class="dropdown-item" data-lang="en">🇺🇸 English</button>
                            <button class="dropdown-item" data-lang="ru">🇷🇺 Русский</button>
                            <button class="dropdown-item" data-lang="es">🇪🇸 Español</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main id="body">
        <div class="container">
            <div class="row">
                <div class="col-mb-12 col-12" id="main" role="main">
                    <div class="post-content" style="padding: 20px 0;">
                        <!-- 标题区 -->
                        <div class="dash-header">
                            <div>
                                <h2 data-i18n="dashboard.title">📊 信息仪表板</h2>
                                <p class="dash-subtitle" data-i18n="dashboard.subtitle">以下是从您的本次访问中获取到的信息</p>
                            </div>
                            <button class="dash-refresh-btn" id="refreshBtn" data-i18n="dashboard.refreshBtn">🔄 刷新</button>
                        </div>

                        <!-- 问候条 -->
                        <div class="dash-greeting" id="greetingBar"></div>

                        <!-- 实时时钟条 -->
                        <div class="dash-time-bar" id="clockBar"></div>

                        <!-- 信息卡片网格 -->
                        <div class="dash-grid">
                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionServer">🌐 网络信息（服务器视角）</h3>
                                <dl class="dash-list" id="serverInfoList">
                                    <div class="dash-loading" data-i18n="dashboard.loading">正在获取服务器视角信息…</div>
                                </dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionBrowser">🖥️ 浏览器信息</h3>
                                <dl class="dash-list" id="browserInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionSystem">⚙️ 系统信息</h3>
                                <dl class="dash-list" id="systemInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionConnection">📶 网络连接</h3>
                                <dl class="dash-list" id="connectionInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionPage">📄 页面信息</h3>
                                <dl class="dash-list" id="pageInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionGaming">🎮 游戏/设备能力</h3>
                                <dl class="dash-list" id="gamingInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionSecurity">🔒 安全与隐私</h3>
                                <dl class="dash-list" id="securityInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionStorage">💾 存储信息</h3>
                                <dl class="dash-list" id="storageInfoList"></dl>
                            </section>

                            <section class="dash-card">
                                <h3 data-i18n="dashboard.sectionDevice">📱 设备特征</h3>
                                <dl class="dash-list" id="deviceInfoList"></dl>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer">
        <div class="site-info">
            <p class="site-address">
